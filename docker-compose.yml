services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: titans
      POSTGRES_PASSWORD: titans
      POSTGRES_DB: titans_cnc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: cnc-meilisearch
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: masterKey
      # Telemetry phoning home on every local boot is noise, and the index holds
      # local development data only.
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      # Bind mount into .runtime/, NOT a named Docker volume.
      #
      # These two are not interchangeable and the difference caused real confusion. The
      # live container was started ad-hoc as `cnc-meilisearch` with
      # `.runtime/meili/data -> /meili_data`, and holds the working 150-document
      # `titan_search` index. Compose declared a *named* volume `meilidata`, so
      # `docker compose up meilisearch` would have produced a second container named
      # `cnc-meilisearch-1` against a different, empty volume — the app would have
      # connected to a blank index and silently fallen back to Postgres search.
      #
      # A bind mount keeps the index beside the repo (gitignored), so it is visible,
      # backup-able and wiped with an obvious `rm -rf .runtime`.
      - ./.runtime/meili/data:/meili_data
    healthcheck:
      # `depends_on: condition: service_healthy` elsewhere needs this to be meaningful.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    ports:
      - '9002:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - miniodata:/data

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/titans-local --ignore-existing &&
      mc anonymous set public local/titans-local
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
