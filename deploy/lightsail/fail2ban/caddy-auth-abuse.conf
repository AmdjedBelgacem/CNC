# Failed or rate-limited AUTHENTICATION attempts, from Caddy's JSON access log.
# Installed on the host as /etc/fail2ban/filter.d/caddy-auth-abuse.conf.
#
# Matches the VISITOR's address (`client_ip`), not `remote_ip`. Cloudflare is in front,
# so `remote_ip` is a Cloudflare edge shared by many visitors: banning it would cut off
# everyone routed through that edge. Caddy fills `client_ip` from CF-Connecting-IP only
# when the peer is in Cloudflare's ranges (trusted_proxies in the Caddyfile).
#
# Note: visitor traffic reaches the host from Cloudflare, so a host-firewall ban on the
# visitor's own address does not stop it. The effective per-visitor controls are Caddy's
# rate_limit zones (keyed on {client_ip}) and the API throttles; this jail keeps the
# record and only ever names real visitor addresses.
#
# Field order in Caddy's log: request.remote_ip, request.remote_port, request.client_ip.
[Definition]
failregex = ^\{.*"request":\{"remote_ip":"[^"]*","remote_port":"[^"]*","client_ip":"<HOST>",.*"uri":"/(?:api/proxy)?/auth/(?:login|register|forgot-password|resend-verification|reset-password|oauth/[a-z]+/callback|2fa/verify)[^"]*".*"status":(?:401|403|429),

ignoreregex =
