name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm typecheck

  frontend-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install
      # Same reason as the backend job: 103 frontend files import @titan/shared, whose
      # `main`/`types` point at `dist/`. Building it directly bypassed turbo's
      # `dependsOn: ["^build"]`, so the fresh checkout had no dist and the build failed.
      - run: pnpm turbo build --filter=@titan/frontend

  backend-build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: titans
          POSTGRES_PASSWORD: titans
          POSTGRES_DB: titans_cnc
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install
      # `pnpm --filter @titan/backend build` runs `nest build` directly, which bypasses
      # turbo's `dependsOn: ["^build"]`, so @titan/shared was never built and its
      # `dist/` (the package's `main`/`types`) did not exist -> 55 TS2307 errors.
      # Building through turbo builds workspace dependencies first.
      - run: pnpm turbo build --filter=@titan/backend
        env:
          DATABASE_URL: postgresql://titans:titans@localhost:5432/titans_cnc
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          S3_BUCKET: test
